
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-forecasting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-forecasting
  template:
    metadata:
      labels:
        app: weather-forecasting
    spec:
      containers:
        - name: weather-app
          image: weather-forecasting:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
